<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question for you... 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Warm sunset/evening romantic gradient */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(255, 77, 109, 0.15);
            padding: 50px 40px;
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 500px;
            position: relative;
        }

        h1 {
            color: #d90429;
            font-size: 2.2em;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.subtitle {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .message-box {
            min-height: 24px;
            color: #ef233c;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        /* Button Container & Buttons */
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 14px 35px;
            font-size: 1.2em;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            outline: none;
        }

        #yesBtn {
            background-color: #ef233c;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 35, 60, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s;
            position: relative;
            z-index: 12;
        }

        #yesBtn:hover {
            background-color: #d90429;
            box-shadow: 0 6px 25px rgba(217, 4, 41, 0.6);
        }

        #noBtn {
            background-color: white;
            color: #ef233c;
            border: 2px solid #ffb3c1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            z-index: 15;
        }

        /* Success Screen */
        .hidden { display: none !important; }
        .fade-out { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }

        #successState {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #successState.show {
            opacity: 1;
            transform: scale(1);
        }

        .bounce-anim {
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        #successState h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
        }

        #successState p {
            color: #444;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        /* Confetti Canvas Container */
        #confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8em; }
            .card { padding: 40px 20px; }
            button { padding: 12px 25px; font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div id="confetti-container"></div>

    <div class="card" id="mainCard">
        
        <div id="questionState">
            <h1>Can we go on a romantic date? 🌹</h1>
            <p class="subtitle">I know a really great place...</p>
            
            <div class="message-box" id="messageBox"></div>

            <div class="buttons-container" id="btnContainer">
                <button id="yesBtn">💕 Yes!</button>
                <button id="noBtn">🙈 No</button>
            </div>
        </div>

        <div id="successState" class="hidden bounce-anim">
            <h1>🍷 YAYYYYY!!! 🍷</h1>
            <p><strong>It's officially a date.</strong></p>
            <br>
            <p>Get ready for an amazing time.</p>
            <p>I'll plan everything,</p>
            <p>you just bring your lovely self. ❤️</p>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msgBox = document.getElementById('messageBox');
        const questionState = document.getElementById('questionState');
        const successState = document.getElementById('successState');
        
        let escapeCount = 0;
        let yesScale = 1;
        let noScale = 1;
        let yesGlow = 15;
        let isMoving = false;

        // Brand new messages for the Date theme!
        const messages = [
            "Are you sure? 🥺",
            "I'm paying for the food! 🍕",
            "Nice try 😂",
            "I promise it'll be fun! 🌹",
            "Give the Yes button a chance ❤️",
            "I'm wearing my good shirt for this.",
            "Please? I'll let you pick the movie 🥹",
            "You know you want to 😏",
            "Don't click that!",
            "Just say yes already 💖"
        ];

        function initBgHearts() {
            setInterval(() => createHeart(false), 400);
        }

        function createHeart(isBurst) {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerHTML = ['🌹', '💕', '🍷', '✨'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            
            if (isBurst) {
                heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                heart.style.bottom = '50%'; 
            } else {
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            }
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }

        window.addEventListener('load', () => {
            initBgHearts();
            
            const rect = noBtn.getBoundingClientRect();
            document.getElementById('btnContainer').style.minWidth = document.getElementById('btnContainer').offsetWidth + 'px';
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = rect.left + 'px';
            noBtn.style.top = rect.top + 'px';
            noBtn.style.margin = '0';
            
            setTimeout(() => {
                noBtn.style.transition = 'all 1.2s ease-out';
            }, 50);
        });

        document.addEventListener('mousemove', (e) => checkDistance(e.clientX, e.clientY));
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                checkDistance(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        function checkDistance(cursorX, cursorY) {
            if (successState.classList.contains('show') || isMoving) return;

            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;
            const distance = Math.hypot(cursorX - btnCenterX, cursorY - btnCenterY);

            // 60px distance limit
            if (distance < 60) {
                moveNoBtn();
            }
        }

        function moveNoBtn() {
            isMoving = true; 
            
            // The bulletproof percentage math
            const randomX = Math.floor(Math.random() * 65) + 10; 
            const randomY = Math.floor(Math.random() * 65) + 10; 

            noBtn.style.left = randomX + 'vw';
            noBtn.style.top = randomY + 'vh';

            escapeCount++;
            updateProgressiveEffects();

            // 1-second cooldown
            setTimeout(() => { isMoving = false; }, 1000);
        }

        function updateProgressiveEffects() {
            msgBox.innerText = messages[Math.floor(Math.random() * messages.length)];
            
            yesScale += 0.08;
            noScale = Math.max(0.6, noScale - 0.05); 
            yesGlow += 4;

            yesBtn.style.transform = `scale(${yesScale})`;
            yesBtn.style.boxShadow = `0 ${4 + escapeCount}px ${yesGlow}px rgba(239, 35, 60, 0.7)`;
            noBtn.style.transform = `scale(${noScale})`;
        }

        yesBtn.addEventListener('click', () => {
            noBtn.style.display = 'none';
            questionState.classList.add('fade-out');
            
            setTimeout(() => {
                questionState.classList.add('hidden');
                successState.classList.remove('hidden');
                setTimeout(() => { successState.classList.add('show'); }, 50);
                triggerCelebration();
            }, 500);
        });

        function triggerCelebration() {
            for (let i = 0; i < 40; i++) {
                setTimeout(() => createHeart(true), i * 30);
            }

            const colors = ['#ff9a9e', '#fecfef', '#ef233c', '#d90429', '#ffffff'];
            const container = document.getElementById('confetti-container');
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                
                const size = Math.random() * 8 + 6;
                confetti.style.width = size + 'px';
                confetti.style.height = (size * 1.5) + 'px';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 1.5 + 's';
                
                container.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
